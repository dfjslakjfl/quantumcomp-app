<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'Ostrich Sans';
    src: url('fonts/OstrichSans-Medium.otf') format('opentype');
    font-weight: normal;
    font-style: normal;
  }
  @font-face {
    font-family: 'Ostrich Sans';
    src: url('fonts/OstrichSans-Light.otf') format('opentype');
    font-weight: 300;
    font-style: normal;
  }
  @font-face {
    font-family: 'Ostrich Sans';
    src: url('fonts/OstrichSans-Bold.otf') format('opentype');
    font-weight: 700;
    font-style: normal;
  }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  canvas { display: block; }
  #textbox {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    box-sizing: border-box;
    width: 100%;
    min-height: 40px;
    max-height: 40%;
    padding: 8px 12px;
    background: rgba(20, 20, 30, 0.9);
    color: #eee;
    border: none;
    border-top: 1px solid #334;
    font: 22px 'Ostrich Sans', sans-serif;
    line-height: 1.4;
    outline: none;
    resize: none;
    overflow-y: auto;
    z-index: 10;
  }
  #textbox.invalid { box-shadow: inset 0 2px 0 0 #ff4444; }
  #hint {
    position: fixed;
    top: 8px; right: 12px;
    color: #889;
    font: 14px 'Ostrich Sans', sans-serif;
    opacity: 0.6;
    pointer-events: none;
    z-index: 10;
  }
</style>
</head>
<body>
<textarea id="textbox" rows="1" placeholder="e.g. |0>,  1/sqrt(2) |0> + 1/sqrt(2) |1>,  sqrt(3)/2 |0> + 1/2 |1>,  |+>,  e^(i pi/4) |1>  (separate multiple qubits with commas)"></textarea>
<div id="hint">left drag: rotate &nbsp;·&nbsp; middle / shift+left drag: pan &nbsp;·&nbsp; scroll: zoom</div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
camera.position.set(3, 2, 4);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
document.body.appendChild(renderer.domElement);

/* ================= math: complex numbers & ket expressions ================= */

const C = (re, im = 0) => ({ re, im });
const cadd = (u, v) => C(u.re + v.re, u.im + v.im);
const csub = (u, v) => C(u.re - v.re, u.im - v.im);
const cmul = (u, v) => C(u.re * v.re - u.im * v.im, u.re * v.im + u.im * v.re);
const cdiv = (u, v) => {
  const d = v.re * v.re + v.im * v.im;
  if (d === 0) throw new Error('division by zero');
  return C((u.re * v.re + u.im * v.im) / d, (u.im * v.re - u.re * v.im) / d);
};
const cabs = u => Math.hypot(u.re, u.im);
const cscale = (u, s) => C(u.re * s, u.im * s);

// u^v for complex u, v (polar form); handles real, imaginary and general exponents
function cpow(u, v) {
  if (u.re === 0 && u.im === 0) {
    if (v.re === 0 && v.im === 0) return C(1);
    throw new Error('0^0 or 0^i undefined');
  }
  const r = cabs(u), phi = Math.atan2(u.im, u.re);
  // (r e^{i phi})^(c+id) = r^c e^{-d phi} * e^{i (c phi + d ln r)}
  const mag = Math.pow(r, v.re) * Math.exp(-v.im * phi);
  const ang = v.re * phi + v.im * Math.log(r);
  return C(mag * Math.cos(ang), mag * Math.sin(ang));
}

// a ket value is a state vector {|0> amplitude, |1> amplitude}
const KETS = {
  '|0>':  { a: C(1), b: C(0) },
  '|1>':  { a: C(0), b: C(1) },
  '|+>':  { a: C(Math.SQRT1_2), b: C(Math.SQRT1_2) },
  '|->':  { a: C(Math.SQRT1_2), b: C(-Math.SQRT1_2) },
  '|i>':  { a: C(Math.SQRT1_2), b: C(0, Math.SQRT1_2) },
  '|-i>': { a: C(Math.SQRT1_2), b: C(0, -Math.SQRT1_2) }
};

/* values are tagged: scalars ({scalar: true}) vs qubit states a|0> + b|1>.
   explicit tagging keeps states with b = 0 (e.g. |0>) from looking like scalars */
const Sc = z => ({ a: z, b: C(0), scalar: true });    // scalar wrapping a complex number
const St = (a, b) => ({ a, b, scalar: false });       // state a|0> + b|1>
const isScalar = s => s.scalar === true;

// state arithmetic: scalars scale states; two states cannot be multiplied
function smul(u, v) {
  if (isScalar(u) && isScalar(v)) return Sc(cmul(u.a, v.a));
  if (isScalar(u)) return St(cmul(u.a, v.a), cmul(u.a, v.b));
  if (isScalar(v)) return St(cmul(u.a, v.a), cmul(u.b, v.a));
  throw new Error('cannot multiply two states');
}
function sdiv(u, v) {
  if (!isScalar(v)) throw new Error('cannot divide by a state');
  return isScalar(u) ? Sc(cdiv(u.a, v.a)) : St(cdiv(u.a, v.a), cdiv(u.b, v.a));
}
function sadd(u, v) {
  if (isScalar(u) !== isScalar(v)) throw new Error('cannot add a scalar and a state');
  return isScalar(u) ? Sc(cadd(u.a, v.a)) : St(cadd(u.a, v.a), cadd(u.b, v.b));
}
function ssub(u, v) {
  if (isScalar(u) !== isScalar(v)) throw new Error('cannot subtract a scalar and a state');
  return isScalar(u) ? Sc(csub(u.a, v.a)) : St(csub(u.a, v.a), csub(u.b, v.b));
}

/* tokenizer: kets are atomic; implicit multiplication supported */
function tokenize(src) {
  src = src.replace(/−/g, '-').replace(/⟩/g, '>').replace(/√/g, 'sqrt');
  const tokens = [];
  let i = 0;
  while (i < src.length) {
    const ch = src[i];
    if (/\s/.test(ch)) { i++; continue; }
    if (ch === '|') {
      const rest = src.slice(i);
      const m = rest.match(/^\|(0|1|\+|-i|-|i)>/);
      if (!m) throw new Error(`unrecognized ket at "${rest.slice(0, 6)}"`);
      tokens.push({ t: 'ket', v: m[0] });
      i += m[0].length;
      continue;
    }
    if (/[0-9.]/.test(ch)) {
      const m = src.slice(i).match(/^([0-9]+\.?[0-9]*|\.[0-9]+)/);
      if (!m) throw new Error(`malformed number at "${src.slice(i, i + 6)}"`);
      tokens.push({ t: 'num', v: parseFloat(m[0]) });
      i += m[0].length;
      continue;
    }
    if (/[a-z]/i.test(ch)) {
      const m = src.slice(i).match(/^[a-z]+/i)[0];
      if (m === 'i') tokens.push({ t: 'i' });
      else if (m === 'pi') tokens.push({ t: 'pi' });
      else if (m === 'e') tokens.push({ t: 'e' });
      else if (m === 'sqrt' || m === 'exp') tokens.push({ t: 'fn', v: m });
      else throw new Error(`unknown symbol "${m}"`);
      i += m.length;
      continue;
    }
    if ('+-*/^()'.includes(ch)) { tokens.push({ t: ch }); i++; continue; }
    throw new Error(`unexpected character "${ch}"`);
  }
  return tokens;
}

/* recursive-descent parser producing states/scalars */
function parseExpr(tokens) {
  let pos = 0;
  const peek = () => tokens[pos];
  const next = () => tokens[pos++];
  const expect = t => {
    if (!peek() || peek().t !== t) throw new Error(`expected "${t}"`);
    return next();
  };

  function expr() {
    let v = term();
    while (peek() && (peek().t === '+' || peek().t === '-'))
      v = (next().t === '+') ? sadd(v, term()) : ssub(v, term());
    return v;
  }
  function term() {
    let v = unary();
    for (;;) {
      const p = peek();
      if (p && p.t === '*') { next(); v = smul(v, unary()); }
      else if (p && p.t === '/') { next(); v = sdiv(v, unary()); }
      else if (p && (p.t === 'num' || p.t === 'i' || p.t === 'pi' || p.t === 'e' || p.t === 'fn' || p.t === 'ket' || p.t === '('))
        v = smul(v, unary());          // implicit multiplication (Desmos-style)
      else break;
    }
    return v;
  }
  function unary() {
    if (peek() && peek().t === '-') { next(); return neg(unary()); }
    if (peek() && peek().t === '+') { next(); return unary(); }
    return power();
  }
  function neg(s) { return isScalar(s) ? Sc(cscale(s.a, -1)) : St(cscale(s.a, -1), cscale(s.b, -1)); }
  function power() {
    let v = atom();
    if (peek() && peek().t === '^') { next(); v = spow(v, unary()); }
    return v;
  }
  function spow(u, v) {
    if (!isScalar(v)) throw new Error('cannot raise to a state power');
    return isScalar(u) ? Sc(cpow(u.a, v.a)) : St(cpow(u.a, v.a), cpow(u.b, v.a));
  }
  function atom() {
    const p = next();
    if (!p) throw new Error('unexpected end of expression');
    if (p.t === 'num') return Sc(C(p.v));
    if (p.t === 'i') return Sc(C(0, 1));
    if (p.t === 'pi') return Sc(C(Math.PI));
    if (p.t === 'e') return Sc(C(Math.E));
    if (p.t === 'ket') return KETS[p.v];
    if (p.t === '(') { const v = expr(); expect(')'); return v; }
    if (p.t === 'fn') {
      if (p.v === 'sqrt') {
        expect('(');
        const v = expr();
        expect(')');
        if (!isScalar(v)) throw new Error('sqrt of a state');
        if (v.a.re < 0 || v.a.im !== 0) throw new Error('sqrt of negative');
        return Sc(C(Math.sqrt(v.a.re)));
      }
      if (p.v === 'exp') {
        expect('(');
        const v = expr();
        expect(')');
        if (!isScalar(v)) throw new Error('exp of a state');
        return Sc(cpow(C(Math.E), v.a));
      }
    }
    throw new Error(`unexpected token "${p.t}"`);
  }

  const v = expr();
  if (pos < tokens.length) throw new Error(`unexpected "${tokens[pos].v ?? tokens[pos].t}"`);
  return v;
}

/* parse one comma-separated qubit expression -> normalized state */
function parseQubit(src) {
  const s = parseExpr(tokenize(src));
  if (isScalar(s)) throw new Error('not a qubit state');
  const mag = Math.hypot(cabs(s.a), cabs(s.b));
  if (mag < 1e-12) throw new Error('zero state');
  return St(cscale(s.a, 1 / mag), cscale(s.b, 1 / mag));
}

// Bloch vector of a|0> + b|1>  (r_x = 2 Re(a* b), r_y = 2 Im(a* b), r_z = |a|^2 - |b|^2)
function blochVector(state) {
  const ab = cmul(C(state.a.re, -state.a.im), state.b);
  return new THREE.Vector3(
    2 * ab.re,            // r_x
    2 * ab.im,            // r_y
    state.a.re ** 2 + state.a.im ** 2 - state.b.re ** 2 - state.b.im ** 2  // r_z
  );
}

/* ================= scene: reusable Bloch sphere assemblies ================= */

const sphereGeo = new THREE.SphereGeometry(1, 48, 36);
// MeshBasicMaterial: the scene has no lights, so Phong would render black/invisible
const sphereMat = new THREE.MeshBasicMaterial({
  color: 0x2255aa, transparent: true, opacity: 0.12,
  side: THREE.DoubleSide, depthWrite: false
});
const wireMat = new THREE.LineBasicMaterial({ color: 0x4488ff, transparent: true, opacity: 0.18 });
const equatorGeo = new THREE.BufferGeometry().setFromPoints(
  new THREE.EllipseCurve(0, 0, 1, 1, 0, Math.PI * 2).getPoints(128).map(p => new THREE.Vector3(p.x, 0, -p.y))
);
const equatorMat = new THREE.LineBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 0.4 });
const arrowHead = { headLength: 0.06, headWidth: 0.03 };
const labelMats = {
  '|0>': makeLabelMat('|0\u27E9', '#ff6666'),  '|1>': makeLabelMat('|1\u27E9', '#ff6666'),
  '|+>': makeLabelMat('|+\u27E9', '#66ff66'),  '|->': makeLabelMat('|\u2212\u27E9', '#66ff66'),
  '|i>': makeLabelMat('|i\u27E9', '#66aaff'),  '|-i>': makeLabelMat('|\u2212i\u27E9', '#66aaff')
};

function makeLabelMat(text, color) {
  const scale = 4;
  const canvas = document.createElement('canvas');
  canvas.width = 128 * scale;
  canvas.height = 64 * scale;
  const ctx = canvas.getContext('2d');
  ctx.scale(scale, scale);
  ctx.font = '40px serif';
  ctx.fillStyle = color;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, 64, 34);
  return new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvas), transparent: true, depthTest: false });
}

function makeLabelSprite(key) {
  const s = new THREE.Sprite(labelMats[key]);
  s.scale.set(0.45, 0.225, 1);
  return s;
}

function makeAssembly() {
  const g = new THREE.Group();
  // Create sparse grid lines (latitude/longitude) manually, full sphere
  const wireGroup = new THREE.Group();
  const latitudes = [-60, -30, 30, 60]; // degrees (equator drawn separately)
  const longitudes = [0, 45, 90, 135]; // degrees (each is a full great circle)
  for (const lat of latitudes) {
    const points = [];
    const theta = (Math.PI / 180) * lat;
    for (let i = 0; i <= 128; i++) {
      const phi = (Math.PI * 2 * i) / 128;
      const x = Math.cos(theta) * Math.sin(phi);
      const y = Math.sin(theta);
      const z = -Math.cos(theta) * Math.cos(phi);
      points.push(new THREE.Vector3(x, y, z));
    }
    wireGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(points), wireMat));
  }
  for (const lon of longitudes) {
    const points = [];
    const theta = (Math.PI / 180) * lon;
    for (let i = 0; i <= 128; i++) {
      const phi = (Math.PI * 2 * i) / 128;
      const x = Math.cos(phi) * Math.cos(theta);
      const y = Math.sin(phi);
      const z = -Math.cos(phi) * Math.sin(theta);
      points.push(new THREE.Vector3(x, y, z));
    }
    wireGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(points), wireMat));
  }
  g.add(
    wireGroup,
    new THREE.Line(equatorGeo, equatorMat),
    new THREE.Mesh(sphereGeo, sphereMat),
    new THREE.ArrowHelper(new THREE.Vector3(1, 0, 0), new THREE.Vector3(), 1.25, 0x44ff44, arrowHead.headLength, arrowHead.headWidth),
    new THREE.ArrowHelper(new THREE.Vector3(-1, 0, 0), new THREE.Vector3(), 1.25, 0x44ff44, arrowHead.headLength, arrowHead.headWidth),
    new THREE.ArrowHelper(new THREE.Vector3(0, 1, 0), new THREE.Vector3(), 1.25, 0xff4444, arrowHead.headLength, arrowHead.headWidth),
    new THREE.ArrowHelper(new THREE.Vector3(0, -1, 0), new THREE.Vector3(), 1.25, 0xff4444, arrowHead.headLength, arrowHead.headWidth),
    new THREE.ArrowHelper(new THREE.Vector3(0, 0, 1), new THREE.Vector3(), 1.25, 0x4488ff, arrowHead.headLength, arrowHead.headWidth),
    new THREE.ArrowHelper(new THREE.Vector3(0, 0, -1), new THREE.Vector3(), 1.25, 0x4488ff, arrowHead.headLength, arrowHead.headWidth)
  );
  // labels at the arrow tips
  const tips = {
    '|0>': [0, 1.45, 0],  '|1>': [0, -1.45, 0],
    '|+>': [1.45, 0, 0],  '|->': [-1.45, 0, 0],
    '|i>': [0, 0, 1.45],  '|-i>': [0, 0, -1.45]
  };
  for (const [k, p] of Object.entries(tips)) {
    const s = makeLabelSprite(k);
    s.position.set(...p);
    g.add(s);
  }
  // state arrow (white), hidden until a valid state is entered
  const stateArrow = new THREE.ArrowHelper(new THREE.Vector3(0, 1, 0), new THREE.Vector3(), 1, 0xffffff, 0.12, 0.06);
  stateArrow.visible = false;
  g.add(stateArrow);
  g.userData.stateArrow = stateArrow;
  return g;
}

/* parent group for all assemblies */
const root = new THREE.Group();
scene.add(root);

const assemblies = [];

/* split input on top-level commas -> one expression per qubit */
function splitQubits(src) {
  const parts = [];
  let depth = 0, cur = '';
  for (const ch of src) {
    if (ch === '(') depth++;
    if (ch === ')') depth--;
    if (ch === ',' && depth === 0) { parts.push(cur); cur = ''; }
    else cur += ch;
  }
  parts.push(cur);
  return parts.map(s => s.trim()).filter(s => s.length);
}

const textbox = document.getElementById('textbox');

// auto-grow to fit content (placeholder and typed text), capped at 40% viewport
// height is border-box, so add border widths to scrollHeight (which is content+padding)
function autoSize() {
  const borders = textbox.offsetHeight - textbox.clientHeight;
  textbox.style.height = 'auto';
  textbox.style.height = Math.min(textbox.scrollHeight + borders, 0.4 * innerHeight) + 'px';
}
textbox.addEventListener('input', () => { autoSize(); update(); });
addEventListener('resize', autoSize);

// camera framing: re-fit the view whenever the row width (qubit count) changes
let lastLayoutN = -1;
let frameRadius = 1.7;

function update() {
  const src = textbox.value.trim();
  let states = [];
  if (src) {
    try {
      states = splitQubits(src).map(parseQubit);
      textbox.classList.remove('invalid');
    } catch (e) {
      textbox.classList.add('invalid');
      return;                           // keep last valid render
    }
  } else {
    textbox.classList.remove('invalid');
  }
  if (!states.length) states = [null];   // one sphere, no state arrow

  // ensure one assembly per qubit
  while (assemblies.length < states.length) {
    const a = makeAssembly();
    assemblies.push(a);
    root.add(a);
  }
  while (assemblies.length > states.length) root.remove(assemblies.pop());

  // layout: 1 qubit big and centered, several qubits in a scaled row
  const n = states.length;
  const s = n === 1 ? 1 : Math.min(0.55, 2.6 / n);
  const spacing = 3.3 * s;
  assemblies.forEach((a, i) => {
    a.scale.setScalar(s);
    a.position.set((i - (n - 1) / 2) * spacing, 0, 0);
    const st = states[i];
    const arrow = a.userData.stateArrow;
    if (st) {
      // Bloch (x, y, z) -> three.js (x, z, y): |0>/|1> vertical, |i>/|-i> along three.js Z
      const bv = blochVector(st);
      arrow.setDirection(new THREE.Vector3(bv.x, bv.z, bv.y));
      arrow.visible = true;
    } else {
      arrow.visible = false;
    }
  });

  // fit the camera to the row whenever its width changes so spheres never overflow
  if (n !== lastLayoutN) {
    lastLayoutN = n;
    frameRadius = (n - 1) / 2 * spacing + 1.7 * s;
    frameContent(frameRadius);
  }
}

/* ============ navigation: Blender-style camera controls ============
   left drag: orbit the view · middle (or shift+left) drag: pan · scroll: zoom */
const view = {
  target: new THREE.Vector3(0, 0, 0),
  yaw: Math.atan2(3, 4),      // orientation matches the initial camera position (3, 2, 4)
  pitch: Math.atan2(2, 5),
  dist: Math.hypot(3, 2, 4)
};
let userNavigated = false;     // manual camera moves disable auto re-fit on resize

function applyView() {
  const cp = Math.cos(view.pitch), sp = Math.sin(view.pitch);
  camera.position.set(
    view.target.x + view.dist * cp * Math.sin(view.yaw),
    view.target.y + view.dist * sp,
    view.target.z + view.dist * cp * Math.cos(view.yaw)
  );
  camera.lookAt(view.target);
}

// pull the camera back until a sphere of the given radius fits on screen
function frameContent(radius) {
  const vFov = THREE.MathUtils.degToRad(camera.fov);
  const hFov = 2 * Math.atan(Math.tan(vFov / 2) * camera.aspect);
  view.target.set(0, 0, 0);
  view.dist = Math.min(60, radius / Math.sin(Math.min(vFov, hFov) / 2) * 1.05);
  applyView();
}

let dragMode = '', prevX = 0, prevY = 0;
renderer.domElement.addEventListener('pointerdown', e => {
  if (e.button === 1) dragMode = 'pan';            // middle mouse moves around
  else if (e.button === 0) dragMode = e.shiftKey ? 'pan' : 'orbit';
  else return;
  prevX = e.clientX;
  prevY = e.clientY;
  userNavigated = true;
  renderer.domElement.setPointerCapture(e.pointerId);
  e.preventDefault();                              // no middle-click autoscroll
});
addEventListener('pointerup', () => { dragMode = ''; });
addEventListener('pointercancel', () => { dragMode = ''; });
addEventListener('pointermove', e => {
  if (!dragMode) return;
  const dx = e.clientX - prevX;
  const dy = e.clientY - prevY;
  prevX = e.clientX;
  prevY = e.clientY;

  if (dragMode === 'orbit') {
    // orbit: the scene follows the cursor
    view.yaw -= dx * 0.005;
    view.pitch += dy * 0.005;
    view.pitch = Math.max(-Math.PI / 2 + 0.01, Math.min(Math.PI / 2 - 0.01, view.pitch));
  } else {
    // pan: drag the scene with the cursor in the camera's screen plane
    const k = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * view.dist / innerHeight;
    const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion).normalize();
    const up = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion).normalize();
    view.target.addScaledVector(right, -dx * k);
    view.target.addScaledVector(up, dy * k);
  }
  applyView();
});
renderer.domElement.addEventListener('wheel', e => {
  e.preventDefault();
  userNavigated = true;
  view.dist = Math.min(60, Math.max(0.5, view.dist * Math.exp(e.deltaY * 0.001)));
  applyView();
}, { passive: false });

autoSize();
update();

function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  if (!userNavigated) frameContent(frameRadius);   // auto re-fit until the user takes over
});
</script>
</body>
</html>
