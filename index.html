<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
camera.position.set(3, 2, 4);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
document.body.appendChild(renderer.domElement);

// Bloch sphere (translucent)
const sphere = new THREE.Mesh(
  new THREE.SphereGeometry(1, 48, 48),
  new THREE.MeshPhongMaterial({
    color: 0x2255aa,
    transparent: true,
    opacity: 0.15,
    side: THREE.DoubleSide,
    depthWrite: false
  })
);
scene.add(sphere);

// Wireframe outline
const wire = new THREE.LineSegments(
  new THREE.EdgesGeometry(new THREE.SphereGeometry(1, 32, 24)),
  new THREE.LineBasicMaterial({ color: 0x4488ff, transparent: true, opacity: 0.25 })
);
scene.add(wire);

// Equator
const equator = new THREE.Line(
  new THREE.BufferGeometry().setFromPoints(
    new THREE.EllipseCurve(0, 0, 1, 1, 0, Math.PI * 2).getPoints(128).map(p => new THREE.Vector3(p.x, 0, -p.y))
  ),
  new THREE.LineBasicMaterial({ color: 0xffaa00 })
);
scene.add(equator);

// Bloch axes: |0>/|1> along vertical (three.js Y), |+>/|-> along X, |i>/|-i> along Z
function axis(dir, color) {
  return new THREE.ArrowHelper(dir.clone().normalize(), new THREE.Vector3(), 1.25, color, 0.08, 0.04);
}
scene.add(axis(new THREE.Vector3(0, 1, 0), 0xff4444));   // |0> (north pole)
scene.add(axis(new THREE.Vector3(0, -1, 0), 0xff4444));  // |1> (south pole)
scene.add(axis(new THREE.Vector3(1, 0, 0), 0x44ff44));   // |+>
scene.add(axis(new THREE.Vector3(-1, 0, 0), 0x44ff44));  // |->
scene.add(axis(new THREE.Vector3(0, 0, 1), 0x4488ff));   // |i>
scene.add(axis(new THREE.Vector3(0, 0, -1), 0x4488ff));  // |-i>

// Text labels as camera-facing sprites
function makeLabel(text, color) {
  const scale = 4;
  const canvas = document.createElement('canvas');
  canvas.width = 128 * scale;
  canvas.height = 64 * scale;
  const ctx = canvas.getContext('2d');
  ctx.scale(scale, scale);
  ctx.font = '40px serif';
  ctx.fillStyle = color;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, 64, 34);
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
    map: new THREE.CanvasTexture(canvas),
    transparent: true,
    depthTest: false
  }));
  sprite.scale.set(0.45, 0.225, 1);
  return sprite;
}
const labels = [
  ['|0\u27E9', 0xff6666, new THREE.Vector3(0, 1.45, 0)],
  ['|1\u27E9', 0xff6666, new THREE.Vector3(0, -1.45, 0)],
  ['|+\u27E9', 0x66ff66, new THREE.Vector3(1.45, 0, 0)],
  ['|\u2212\u27E9', 0x66ff66, new THREE.Vector3(-1.45, 0, 0)],
  ['|i\u27E9', 0x66aaff, new THREE.Vector3(0, 0, 1.45)],
  ['|\u2212i\u27E9', 0x66aaff, new THREE.Vector3(0, 0, -1.45)]
].map(([text, color, pos]) => {
  const s = makeLabel(text, '#' + color.toString(16).padStart(6, '0'));
  s.position.copy(pos);
  return s;
});

// State vector: some generic state (x, y, z) on the unit sphere
const stateVec = new THREE.Vector3(0.5, 0.7, 0.3).normalize();
const stateArrow = new THREE.ArrowHelper(stateVec, new THREE.Vector3(), 1, 0xffffff, 0.12, 0.06);
scene.add(stateArrow);

// Lights
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const light = new THREE.DirectionalLight(0xffffff, 1);
light.position.set(5, 5, 5);
scene.add(light);

// Mouse "rolling": drag to rotate the whole scene group
const group = new THREE.Group();
scene.add(group);
for (const o of [sphere, wire, equator, stateArrow, ...labels,
                 ...scene.children.filter(o => o.isArrowHelper && o !== stateArrow)]) {
  group.add(o);
}

let isDragging = false, prevX = 0, prevY = 0;
renderer.domElement.addEventListener('pointerdown', e => {
  isDragging = true;
  prevX = e.clientX;
  prevY = e.clientY;
});
addEventListener('pointerup', () => { isDragging = false; });
addEventListener('pointermove', e => {
  if (!isDragging) return;
  const dx = e.clientX - prevX;
  const dy = e.clientY - prevY;
  prevX = e.clientX;
  prevY = e.clientY;

  // Trackball roll: rotate around camera-relative axes so drags always
  // match the hand, no matter how the sphere is currently oriented.
  const speed = 0.005;
  const camUp = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion).normalize();
  const camRight = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion).normalize();
  const q = new THREE.Quaternion()
    .setFromAxisAngle(camUp, dx * speed)
    .multiply(new THREE.Quaternion().setFromAxisAngle(camRight, dy * speed));
  group.quaternion.premultiply(q);
});

function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
